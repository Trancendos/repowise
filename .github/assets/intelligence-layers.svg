B" font-size="12.5">co-change coupling,</text><text x="347.5" y="208" fill="#64748B" font-size="12.5">bus factor — signals</text><text x="347.5" y="226" fill="#64748B" font-size="12.5">statics can&apos;t see.</text><rect width="180" height="168" x="515" y="112" fill="#F8FAFC" stroke="#E2E8F0" rx="12"/><text x="535" y="143" fill="#2563EB" font-size="18" font-weight="700">◈</text><text x="559" y="143" fill="#0F172A" font-size="17" font-weight="700">Docs</text><text x="535" y="172" fill="#64748B" font-size="12.5">LLM wiki per file,</text><text x="535" y="190" fill="#64748B" font-size="12.5">rebuilt every commit.</text><text x="535" y="208" fill="#64748B" font-size="12.5">Hybrid RAG search,</text><text x="535" y="226" fill="#64748B" font-size="12.5">freshness scoring.</text><rect width="180" height="168" x="702.5" y="112" fill="#F8FAFC" stroke="#E2E8F0" rx="12"/><text x="722.5" y="143" fill="#2563EB" font-size="18" font-weight="700">◈</text><text x="746.5" y="143" fill="#0F172A" font-size="17" font-weight="700">Decisions</text><text x="722.5" y="172" fill="#64748B" font-size="12.5">Architectural</text><text x="722.5" y="190" fill="#64748B" font-size="12.5">decisions mined from</text><text x="722.5" y="208" fill="#64748B" font-size="12.5">8 sources, evidence-</text><text x="722.5" y="226" fill="#64748B" font-size="12.5">backed, linked.</text><rect width="180" height="168" x="890" y="112" fill="#FEF6EC" stroke="#F59520" stroke-opacity=".8" rx="12"/><text x="910" y="143" fill="#F59520" font-size="18" font-weight="700">★</text><text x="934" y="143" fill="#0F172A" font-size="17" font-weight="700">Code Health</text><text x="910" y="172" fill="#B45309" font-size="12.5">Defect-validated.</text><text x="910" y="190" fill="#64748B" font-size="12.5">3 signals + concrete</text><text x="910" y="208" fill="#64748B" font-size="12.5">refactoring plans.</text><text x="910" y="226" fill="#64748B" font-size="12.5">Zero LLM, under 30s.</text><line x1="160" x2="300" y1="252" y2="252" stroke